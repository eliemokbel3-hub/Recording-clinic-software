[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-desktop"
version = "0.1.0"
description = "Windows desktop companion for the Cliniko clinical scribe"
# Plan targets 3.12+; dev machine runs 3.14 (recorded in plan Key Findings)
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "pydantic>=2.7",
    "cryptography>=43",
    "keyring>=25",
    "psutil>=6",
    # Phase 2: DPAPI key custody (win32crypt.CryptProtectData) — user-approved
    # dependency in the hardened Phase 2 plan.
    'pywin32>=306; sys_platform == "win32"',
    # Note-learning-and-styles plan Phase 3 (Task 3.3): reading a .docx sample
    # note into memory (`sample_notes.read_sample_note`). BASE, not `[ml]` —
    # the installer ships it; pinned exactly (practitioner-authorised
    # 2026-09-19). Read-only use: the module never writes a document.
    "python-docx==1.2.0",
    # Note-learning-and-styles plan Phase 4 live smoke (practitioner decision
    # 2026-09-20, the Excluded item's revisit trigger met: Cliniko exports
    # notes as PDF): text extraction from a .pdf sample note
    # (`sample_notes._read_pdf`). Pure Python, no native code, NO OCR — a
    # scanned PDF is refused by name. BASE like python-docx; pinned exactly.
    "pypdf==6.19.0",
]

[project.optional-dependencies]
# ML stack for local transcription (Step 5 spike verified all wheels install
# cleanly on Python 3.14). huggingface_hub is only used by the setup-time
# scripts/setup-models.py; runtime stays offline (kill-switches asserted).
ml = [
    "faster-whisper>=1.2",
    "onnxruntime>=1.28",
    "huggingface_hub>=1.0",
]
# The prose runtime (note-learning-and-styles plan Phase 4, Task 4.1; D8) is
# `llama-cpp-python==0.3.35` — pinned by version AND wheel SHA-256 in the
# hashed requirements file beside this one, `requirements-ml-prose.txt`, and
# installed ONLY from it:
#     python -m pip install --require-hashes --no-deps -r desktop/requirements-ml-prose.txt
# It is deliberately NOT listed under `[ml]`: PyPI carries only an sdist of
# that project, so a `[dev,ml]` install (AGENTS.md, CI) would BUILD it from
# source — exactly what D8 forbids — and pip cannot pin a hash or a wheel
# index inside this file. The runtime module (`scribe_desktop.language_model`)
# single-sources the version, wheel URL and digest; the gate test
# `tests/test_language_model_runtime.py` refuses an installed copy that did
# not come from that wheel.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.gui-scripts]
# gui-scripts (not scripts): pip generates pythonw-backed .exe launchers, so
# Chrome spawning the host shows no console window. They MUST be .exe —
# current Chrome refuses to launch .bat/.cmd native messaging hosts.
scribe-app = "scribe_desktop.app:main"
scribe-host = "scribe_desktop.native_host:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Phase 3A Task 3.3: shipped default note config travels inside the wheel so
# a NON-EDITABLE install resolves it via importlib.resources — never __file__.
scribe_desktop = ["config_defaults/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle / pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "G",              # flake8-logging-format: G004 bans f-strings in logging calls
    "TID",            # flake8-tidy-imports: banned-api enforcement below
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Offline contract (Cliniko workflow safeguards plan D9): no connection except
# Cliniko's API, and none at startup or idle. Every network module is banned
# everywhere; the ONE exemption is the `http.client` import in
# `scribe_desktop/cliniko_client.py`, pinned (count and site) by
# `tests/test_cliniko_client.py::TestConfinement`.
"PySide6.QtNetwork" = { msg = "Network APIs are banned: only scribe_desktop/cliniko_client.py talks to the network (plan D9)" }
"socket" = { msg = "The socket module is banned: only scribe_desktop/cliniko_client.py talks to the network (plan D9)" }
"http" = { msg = "HTTP APIs are banned: only scribe_desktop/cliniko_client.py talks to Cliniko's API (plan D9)" }
"urllib.request" = { msg = "Network APIs are banned: only scribe_desktop/cliniko_client.py talks to the network (plan D9)" }

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["scribe_desktop"]

# Untyped native/ML modules (Phase 2 plan Step 1): pywin32 ships no stubs and
# the ML stack is untyped; strict mode would otherwise block every later step
# with "Cannot find implementation or library stub".
[[tool.mypy.overrides]]
module = [
    "win32crypt",
    "win32api",
    "win32con",
    "win32pipe",
    "win32file",
    "win32security",
    # Cliniko workflow safeguards plan Tasks 4.2 / 7.1: the named pipe's
    # overlapped I/O events, and (Phase 7) the hotkey and process checks.
    "win32event",
    "win32gui",
    "win32process",
    "pywintypes",
    "win32com",
    "win32com.*",
    "psutil",
    "sounddevice",
    "faster_whisper",
    "faster_whisper.*",
    "onnxruntime",
    "onnxruntime.*",
    # python-docx ships no stubs (note-learning plan Task 3.3).
    "docx",
    "docx.*",
    # llama-cpp-python ships no stubs (note-learning plan Task 4.1).
    "llama_cpp",
    "llama_cpp.*",
    # pypdf DOES ship `py.typed`; this entry only lets mypy pass on a host
    # where the wheel is not installed (an agent shell, a bare dev venv) —
    # where it is installed, the override is inert and its types are used.
    "pypdf",
    "pypdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
