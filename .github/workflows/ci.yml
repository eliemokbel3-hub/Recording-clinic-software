name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: desktop (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 = declared floor; 3.14 = dev machines
        python: ["3.12", "3.14"]
    env:
      # Integration tests need the machine-level native-host registration
      # (see desktop/tests/test_integration_no_sockets.py) — deliberate skip.
      SCRIBE_SKIP_INTEGRATION: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".\desktop[dev]"
      - name: Ruff
        working-directory: desktop
        run: python -m ruff check .
      - name: Mypy
        working-directory: desktop
        run: python -m mypy
      - name: Pytest
        working-directory: desktop
        run: python -m pytest -q

  extension:
    name: extension (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install
        run: npm ci
      - name: QA (tsc, eslint, vitest)
        run: npm run qa
      - name: Build MV3 bundle
        run: npm run build
