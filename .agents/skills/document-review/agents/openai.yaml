# Codex Skill metadata for $document-review.
#
# document-review is side-effecting: it migrates and rewrites durable
# user-visible docs (AGENTS.md, AGENTS.local.md, README.md, docs/*.md) in a
# single confirmed pass. As of v34.0, implicit ($document-review)
# invocation is permitted (mirrors the SKILL.md frontmatter's
# disable-model-invocation: false for Cursor / Claude Code); safety comes
# from the in-skill gates (a read-only audit first, then
# propose-and-confirm — nothing is applied without the user's explicit
# confirmation), not from invocation-locking. It can still be invoked
# explicitly.
policy:
  allow_implicit_invocation: true
