# Codex Skill metadata for $update-workflow.
#
# Update-workflow is side-effecting: it overwrites installed workflow
# payloads, writes the installed-version marker, and makes a provenance
# commit. As of v34.0, implicit ($update-workflow) invocation is permitted
# so an agent can run the update when the user asks for it; safety comes
# from the in-skill gates (the safety-gate chain — clean tree, live-run
# guard, committed marker — and the one confirm before any write to the
# repo), not from invocation-locking. It never pushes. It can still be
# invoked explicitly.
policy:
  allow_implicit_invocation: true
